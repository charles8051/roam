# Source, build, and target are all this machine.
#
# Everything roam can derive is left out: the schema version, the `local` host,
# the three host roles, the publish block, the launch profile, and the deploy
# path. See ../../docs/configuration.md#defaults.
#
# `csproj:` is spelled out only because this example directory contains no
# project. In your own repo, delete it and roam discovers the single csproj.
csproj: src/MyApp/MyApp.csproj

profiles:
  dev-local:
    description: Build, deploy, run, and debug on the same host.
    deploy:
      # Without a start command roam syncs bytes and stops. Everything below is
      # optional; delete what you do not need.
      start: nohup ./MyApp >/tmp/myapp.log 2>&1 &
      stop: pkill -f '[M]yApp' || true
      ready: pgrep -f MyApp >/dev/null
    debug:
      enabled: true
      debugger: vsdbg
      editor: vscode
      process-name: MyApp

# The same profile with nothing derived, for when you want the deploy somewhere
# other than <workspace>/.roam-dev:
#
#   hosts:
#     local:
#       ssh: localhost
#       user: myuser
#       workspace: /home/myuser/src/myapp
#       os: linux
#
#   profiles:
#     dev-local:
#       source: local
#       build: local
#       target: local
#       publish:
#         rid: linux-x64
#         self-contained: true
#         configuration: Release
#       launch-profile: Development
#       deploy:
#         path: /home/myuser/apps/myapp
#         flatten-publish: true
